<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaRural - Mockup iPhone 15 Pro Max</title>
    <style>
        /* Estilos generales y centrado en pantalla */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Marco exacto para iPhone 14 / 15 Pro Max: 430px x 932px */
        .phone-frame {
            width: 430px;
            height: 932px;
            background-color: #f8fafc;
            border-radius: 54px;
            border: 12px solid #1e293b;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Barra de estado e Isla Dinámica */
        .status-bar {
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            z-index: 20;
        }

        .dynamic-island {
            width: 125px;
            height: 35px;
            background-color: #000000;
            border-radius: 20px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 10px;
        }

        /* Contenedor de pantallas navegables */
        .screen-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px 24px 30px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out;
            background-color: #f8fafc;
        }

        .screen.hidden {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        /* PANTALLA 1: Inicio / Hero */
        .hero-image-box {
            width: 100%;
            height: 340px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }
